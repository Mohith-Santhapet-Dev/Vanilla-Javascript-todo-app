<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>

    <div id = "main-page">
        <h1 id = "header"> Your Tasks </h1>
        <div id = "status-bar">
            <div class = "total-status-section" >
                <div class = "circle"></div>
                <p class = "status-text">Total</p>
                <p id = "total number" class="status-number">0</p>
            </div>
            <div class = "completed-status-section" >
                <div class = "circle green-version"></div>
                <p class = "status-text">Completed</p>
                <p id = "total number" class="status-number">0</p>
            </div>
            <div class = "pending-status-section" >
                <div class = "circle gray-version"></div>
                <p class = "status-text">Pending</p>
                <p id = "total number" class="status-number">0</p>
            </div>
        </div>

        <div id = "add-task-section">
            <input id = "task-input" placeholder="What needs to be done?">
            <button id = "add-task-btn"> + Add Task</button>
        </div>

        <div id = "filter-buttons">
            <button id = "all-button" class = "filter-button"> All </button>
            <button id = "pending-button" class = "filter-button"> Pending </button>
            <button id = "completed-button" class = "filter-button"> Completed </button>
        </div>

        <div id = "task-container">
            <input type = "checkbox" id = "task-checkbox">
            <div id = "task-content">
                <h1 id = "task-title"> Task 1</h1>
                <div id = "task-bottom-section">
                    <p id = "task-date">9:30</p>
                    <div id = "oval-shape">
                        <p id = "task-status"> Pending </p>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src = "script.js"></script>
</body>
</html>
