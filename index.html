<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>

    <div id = "main-page">
        <h1 id = "header"> Your Tasks </h1>
        <div id = "status-bar">
            <div class = "total-status-section" >
                <div class = "circle"></div>
                <p class = "status-text">Total</p>
                <p id = "total number" class="status-number">0</p>
            </div>
            <div class = "completed-status-section" >
                <div class = "circle green-version"></div>
                <p class = "status-text">Completed</p>
                <p id = "total number" class="status-number">0</p>
            </div>
            <div class = "pending-status-section" >
                <div class = "circle gray-version"></div>
                <p class = "status-text">Pending</p>
                <p id = "total number" class="status-number">0</p>
            </div>
        </div>
    </div>


    <script src = "script.js"></script>
</body>
</html>
